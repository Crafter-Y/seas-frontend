# Serves the static Expo web export for every tenant (<id>.seas-kirchengemeinde.de,
# <id>.preview.seas-kirchengemeinde.de). The tenant is the first label of the host name;
# the app reads it from /config.json.
map $host $tenant {
    ~^(?<label>[a-z0-9-]+)\.  $label;
    default                   "";
}

# Expo puts a content hash in /_expo/static/ file names, so they never change. Other files
# keep their names when replaced, so browsers must revalidate.
map $uri $cache_control {
    ~^/_expo/static/                                                      "public, max-age=31536000, immutable";
    ~^/assets/                                                            "public, max-age=31536000, immutable";
    ~*\.(png|jpg|jpeg|gif|webp|ico|svg|ttf|woff|woff2|eot|otf|xml|txt)$   "public, max-age=3600, must-revalidate";
    default                                                               "no-cache";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    # Redirects stay relative: TLS ends at Traefik, so an absolute one would point to http://.
    absolute_redirect off;
    charset utf-8;

    # No access log: it would store users' IP addresses (X-Forwarded-For).
    access_log off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml image/x-icon text/xml
               application/xml text/plain;

    # Headers are set once here; a location with its own add_header would drop all of them.
    add_header Cache-Control $cache_control;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tenant ID for the web app (helpers/appContext.tsx).
    location = /config.json {
        default_type application/json;
        return 200 '{"serverId":"$tenant"}';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Routes are exported as <route>.html or <route>/index.html. Anything else (e.g. dynamic
    # routes like /settings/modules/music/songbooks/5) gets Expo Router's fallback page, which
    # resolves the URL in the browser.
    location / {
        try_files $uri $uri.html $uri/index.html /+not-found.html;
    }

    # /login.html -> /login, as before.
    location ~ ^(?<clean>/.+)\.html$ {
        if ($request_uri ~ \.html) { return 301 $clean$is_args$args; }
        try_files $uri /+not-found.html;
    }

    # Missing files are a plain 404 instead of the fallback page.
    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg|ttf|woff|woff2|eot|otf|json|xml|txt|js|css|map)$ {
        try_files $uri =404;
        log_not_found off;
    }
}
